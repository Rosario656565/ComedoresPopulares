[project]
name = "backend"
version = "0.1.0"
description = "Comedores Populares — Backend API"
readme = "README.md"
authors = [
    { name = "LEIDYUTUS", email = "61206455@continental.edu.pe" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "pyodbc>=5.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
